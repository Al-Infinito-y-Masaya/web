<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Mangroove: el pulso de la marea en el manglar del Estero Real, con datos del satélite NISAR."
		/>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=JetBrains+Mono:wght@400..600&family=Josefin+Sans:wght@600;700&family=Jost:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<!-- Applies the saved theme before React loads to avoid a flash. Keep the key in sync with src/config/app.ts -->
		<script>
			(() => {
				let theme = 'system';
				try {
					theme = localStorage.getItem('app-theme') ?? 'system';
				} catch {}
				const dark =
					theme === 'dark' ||
					(theme === 'system' &&
						window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.add(dark ? 'dark' : 'light');
			})();
		</script>
		<title>Mangroove</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/app/main.tsx"></script>
	</body>
</html>
